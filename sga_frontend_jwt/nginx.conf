# =============================================================================
# nginx.conf — Configuración del servidor frontend SGA
#
# Responsabilidades:
#  1. Servir los archivos estáticos de React (dist/).
#  2. Gestionar rutas de SPA: redirigir todo a index.html para que
#     React Router maneje la navegación sin errores 404 en Nginx.
#  3. Reverse Proxy para /api/: redirige las peticiones al backend
#     FastAPI sin que el navegador cambie de origen → elimina CORS.
# =============================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Configuración de compresión Gzip ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Cache de assets con hash en el nombre (Vite los genera con hash) ─────
    # Estos archivos pueden cachearse de forma agresiva (inmutable)
    location ~* \.(?:js|css|woff2?|ico|png|jpg|jpeg|svg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Reverse Proxy → Backend FastAPI ──────────────────────────────────────
    # Cualquier petición a /api/ se redirige internamente al contenedor
    # "backend" en el puerto 8000. El navegador no sabe que cruza de servidor.
    # Resultado: no hay cambio de origen → CORS no aplica.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts razonables
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── SPA fallback — rutas de React Router ─────────────────────────────────
    # Si el archivo no existe en disco (ej: /alquileres/42), Nginx devuelve
    # index.html y React Router se encarga de resolver la ruta en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Seguridad básica ─────────────────────────────────────────────────────
    # Ocultar la versión de Nginx en las cabeceras de respuesta
    server_tokens off;

    # Cabeceras de seguridad HTTP recomendadas
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
